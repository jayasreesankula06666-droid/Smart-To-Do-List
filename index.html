<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple student To-Do List.">
  <title>Student To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">STUDENT PRODUCTIVITY</p>
      <h1>My To-Do List 📝</h1>
      <p class="subtitle">Plan your day. Finish one task at a time.</p>
    </header>
    <section class="panel" aria-label="Task manager">
      <form id="task-form">
        <label class="sr-only" for="task-input">Enter a task</label>
        <input id="task-input" type="text" maxlength="120" placeholder="What do you need to do?" required>
        <button class="add" type="submit">+ Add task</button>
      </form>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button id="clear-completed" class="text-button" type="button">Clear completed</button>
      </div>
      <p id="task-count" class="count" aria-live="polite">0 tasks remaining</p>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty">✨ Your list is clear. Add your first task!</p>
    </section>
    <footer>Tasks are saved automatically in this browser.</footer>
  </main>
</body>
</html>
